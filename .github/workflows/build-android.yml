name: Build Android APK

on:
  workflow_dispatch: # Allows manual trigger from the GitHub Actions tab
  push:
    branches:
      - main

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'


      - name: Install Node Dependencies
        run: npm install --no-audit --no-fund


      - name: Build Android App (Gradle)
        working-directory: ./android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --stacktrace > build-error.txt 2>&1 || (cat build-error.txt && exit 1)

      - name: Upload Build Log if Failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-log
          path: android/build-error.txt

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: scogestia-app-debug.apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
