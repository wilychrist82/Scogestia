<body class="bg-background text-on-background min-h-screen flex flex-col font-body-md">
<!-- Main Container -->

<!-- Header Section -->
<div class="flex flex-col items-center text-center gap-sm">
<!-- Logo -->
<div class="w-32 h-32 md:w-40 md:h-40 rounded-sm overflow-hidden mb-sm bg-surface-container flex items-center justify-center">
<img alt="Scogestia Logo" class="w-full h-full object-contain" src="https://lh3.googleusercontent.com/aida/AP1WRLsGJdlhJZk6xl6Gs1-6uxfmQeCH1iT8PRJDDt5irpiztj4t2qD19IZwqqPuBdScBypSW0facDw17RxGhjuX6g8QsSTVkqjHhJfeBrsp3BOoVzUiOBCO4sLS5e4DxqEp0ufXVujgQK-FlNPUfNXLWqkmF_R8FdxnMqt2iUtZa_wDtoemXe2Cn_zO3csLDBtDhaCEMt09SpgL613-Z3InLYjFv4Rd1hHsMGhmo8IWT7SOao9yDsSxkcRd48kP"/>
</div>
<h1 class="font-headline-lg-mobile md:font-headline-lg text-headline-lg-mobile md:text-headline-lg text-primary">Connexion Personnel</h1>
<p class="font-body-lg text-body-lg text-on-surface-variant">Accédez à votre espace de gestion scolaire.</p>
</div>
<!-- Form Section -->
<form action="#" class="flex flex-col gap-lg" method="POST">
<!-- Email Input -->
<div class="flex flex-col gap-xs">
<label class="font-label-md text-label-md text-on-surface" for="email">Adresse Email</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-sm flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline">mail</span>
</div>
<input class="w-full h-touch-target pl-touch-target pr-sm bg-surface-bright border border-outline-variant rounded-DEFAULT focus:border-primary-container focus:ring-1 focus:ring-primary-container text-on-surface font-body-lg text-body-lg transition-colors placeholder-on-surface-variant/50" id="email" name="email" placeholder="nom@etablissement.edu" required="" type="email"/>
</div>
</div>
<!-- Password Input -->
<div class="flex flex-col gap-xs">
<div class="flex justify-between items-center">
<label class="font-label-md text-label-md text-on-surface" for="password">Mot de passe</label>
<a class="font-label-md text-label-md text-primary-container hover:text-primary transition-colors focus:outline-none focus:underline" href="#">Mot de passe oublié ?</a>
</div>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-sm flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline">lock</span>
</div>
<input class="w-full h-touch-target pl-touch-target pr-touch-target bg-surface-bright border border-outline-variant rounded-DEFAULT focus:border-primary-container focus:ring-1 focus:ring-primary-container text-on-surface font-body-lg text-body-lg transition-colors placeholder-on-surface-variant/50" id="password" name="password" placeholder="••••••••" required="" type="password"/>
<button aria-label="Afficher le mot de passe" class="absolute inset-y-0 right-0 pr-sm flex items-center text-outline hover:text-on-surface focus:outline-none focus:text-primary-container transition-colors" id="togglePassword" type="button">
<span class="material-symbols-outlined" id="visibilityIcon">visibility_off</span>
</button>
</div>
</div>
<!-- Optional Establishment Dropdown -->
<div class="flex flex-col gap-xs" id="establishmentContainer">
<label class="font-label-md text-label-md text-on-surface" for="establishment">Choisir votre établissement <span class="text-on-surface-variant font-normal">(Optionnel)</span></label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-sm flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline">domain</span>
</div>
<select class="w-full h-touch-target pl-touch-target pr-touch-target bg-surface-bright border border-outline-variant rounded-DEFAULT focus:border-primary-container focus:ring-1 focus:ring-primary-container text-on-surface font-body-lg text-body-lg appearance-none cursor-pointer transition-colors" id="establishment" name="establishment">
<option disabled="" selected="" value="">Sélectionnez un établissement</option>
<option value="ecole1">École Primaire Saint-Jean</option>
<option value="college1">Collège Notre-Dame</option>
<option value="lycee1">Lycée Technique</option>
</select>
<div class="absolute inset-y-0 right-0 pr-sm flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline">expand_more</span>
</div>
</div>
<p class="font-label-sm text-label-sm text-on-surface-variant mt-xs">À remplir uniquement si vous gérez plusieurs écoles.</p>
</div>

<span>Se connecter</span>
<span class="material-symbols-outlined" data-weight="fill" style="font-variation-settings: 'FILL' 1;">login</span>
</button>

<p class="font-label-sm text-label-sm text-on-surface-variant">

                </p>

                </p>
</div>

</main>
<script>
        // Password Visibility Toggle
        document.addEventListener('DOMContentLoaded', () => {
            const togglePasswordBtn = document.getElementById('togglePassword');
            const passwordInput = document.getElementById('password');
            const visibilityIcon = document.getElementById('visibilityIcon');

            togglePasswordBtn.addEventListener('click', () => {
                const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
                passwordInput.setAttribute('type', type);
                
                if(type === 'text') {
                    visibilityIcon.textContent = 'visibility';
                    visibilityIcon.style.fontVariationSettings = "'FILL' 1";
                } else {
                    visibilityIcon.textContent = 'visibility_off';
                    visibilityIcon.style.fontVariationSettings = "'FILL' 0";
                }
            });
            
            // Simple interaction feedback for select
            const establishmentSelect = document.getElementById('establishment');
            establishmentSelect.addEventListener('change', function() {
                if(this.value !== "") {
                    this.classList.add('border-primary-container', 'text-primary-container');
                    this.parentElement.querySelector('.material-symbols-outlined').classList.add('text-primary-container');
                    this.parentElement.querySelector('.material-symbols-outlined').classList.remove('text-outline');
                }
            });
        });
    </script>
