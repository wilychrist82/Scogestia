<script>
        // Simple OTP auto-advance logic
        const otpInputs = document.querySelectorAll('.otp-input-group input');
        
        otpInputs.forEach((input, index) => {
            input.addEventListener('input', (e) => {
                if(e.target.value.length === 1) {
                    if(index < otpInputs.length - 1) {
                        otpInputs[index + 1].focus();
                    }
                }
            });
            
            input.addEventListener('keydown', (e) => {
                if(e.key === 'Backspace' && e.target.value.length === 0) {
                    if(index > 0) {
                        otpInputs[index - 1].focus();
                        otpInputs[index - 1].value = '';
                    }
                }
            });
        });

        // Tab Switching Logic (Visual only for demo)
        const tabPhone = document.getElementById('tab-phone');
        const tabEmail = document.getElementById('tab-email');
        const contactInput = document.getElementById('contact-input');
        const contactLabel = contactInput.previousElementSibling.previousElementSibling; // The label element
        const contactIcon = contactInput.previousElementSibling;

        function setActiveTab(activeBtn, inactiveBtn, labelText, inputType, placeholderText, iconName) {
            activeBtn.classList.add('bg-surface-container-lowest', 'text-primary', 'shadow-sm', 'ring-1', 'ring-outline-variant');
            activeBtn.classList.remove('text-on-surface-variant', 'hover:text-primary');
            activeBtn.setAttribute('aria-selected', 'true');
            
            inactiveBtn.classList.remove('bg-surface-container-lowest', 'text-primary', 'shadow-sm', 'ring-1', 'ring-outline-variant');
            inactiveBtn.classList.add('text-on-surface-variant', 'hover:text-primary');
            inactiveBtn.setAttribute('aria-selected', 'false');

            contactLabel.textContent = labelText;
            contactInput.type = inputType;
            contactInput.placeholder = placeholderText;
            contactIcon.textContent = iconName;
            contactInput.value = ''; // Clear value on switch
        }

        tabPhone.addEventListener('click', () => {
            setActiveTab(tabPhone, tabEmail, 'Numéro de téléphone', 'tel', '+225 00 00 00 00 00', 'call');
        });

        tabEmail.addEventListener('click', () => {
            setActiveTab(tabEmail, tabPhone, 'Adresse Email', 'email', 'parent@exemple.com', 'mail');
        });

    </script>
