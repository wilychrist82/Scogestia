    body {

<body class="font-body-md text-body-md antialiased min-h-screen flex flex-col md:max-w-md md:mx-auto md:bg-white md:shadow-lg md:border-x border-outline-variant relative">
<!-- TopAppBar -->
<header class="flex justify-between items-center px-md h-touch-target w-full bg-surface text-primary border-b border-outline-variant sticky top-0 z-10">
<div class="flex items-center gap-2">
<button class="p-2 -ml-2 rounded-full hover:bg-surface-container-low transition-colors" onclick="history.back()">
<span class="material-symbols-outlined text-primary">arrow_back</span>
</button>
<h1 class="font-headline-sm text-headline-sm font-bold text-primary">Paiement</h1>
</div>
<div class="font-label-md text-label-md text-on-surface-variant bg-surface-container-low px-3 py-1 rounded-full">
            Child: Koffi
        </div>
</header>
<!-- Main Content -->
<main class="flex-1 flex flex-col p-md gap-lg pb-xxl">
<!-- Summary Card -->
<section class="bg-white border border-outline-variant rounded-xl p-md shadow-sm">
<h2 class="font-label-md text-label-md text-on-surface-variant uppercase tracking-wider mb-sm">Récapitulatif</h2>
<div class="flex justify-between items-end">
<div>
<p class="font-headline-md text-headline-md text-on-surface font-semibold">Scolarité T1</p>
<p class="font-body-md text-body-md text-secondary mt-1">Année scolaire 2023-2024</p>
</div>
<div class="text-right">
<p class="font-headline-lg-mobile text-headline-lg-mobile text-primary font-bold">125 000</p>
<p class="font-label-sm text-label-sm text-on-surface-variant font-medium">FCFA</p>
</div>
</div>
</section>
<!-- Payment Methods -->
<section class="flex-1 flex flex-col gap-sm">
<h2 class="font-label-md text-label-md text-on-surface-variant uppercase tracking-wider mb-xs">Moyen de paiement</h2>
<div class="grid grid-cols-1 gap-sm">
<!-- T-Money -->
<label class="relative cursor-pointer">
<input checked="" class="radio-custom sr-only" name="payment_method" type="radio" value="tmoney"/>
<div class="flex items-center justify-between p-md bg-white border border-outline-variant rounded-xl transition-all duration-200">
<div class="flex items-center gap-md">
<div class="w-12 h-12 bg-[#FFD700] rounded-lg flex items-center justify-center font-bold text-black border border-outline-variant/30">
                                T
                            </div>
<span class="font-headline-sm text-headline-sm text-on-surface font-medium">T-Money</span>
</div>
<span class="material-symbols-outlined text-primary check-icon hidden" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</div>
</label>
<!-- Flooz -->
<label class="relative cursor-pointer">
<input class="radio-custom sr-only" name="payment_method" type="radio" value="flooz"/>
<div class="flex items-center justify-between p-md bg-white border border-outline-variant rounded-xl transition-all duration-200">
<div class="flex items-center gap-md">
<div class="w-12 h-12 bg-[#0089C4] rounded-lg flex items-center justify-center font-bold text-white border border-outline-variant/30">
                                F
                            </div>
<span class="font-headline-sm text-headline-sm text-on-surface font-medium">Flooz</span>
</div>
<span class="material-symbols-outlined text-primary check-icon hidden" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</div>
</label>
<!-- Wave -->
<label class="relative cursor-pointer">
<input class="radio-custom sr-only" name="payment_method" type="radio" value="wave"/>
<div class="flex items-center justify-between p-md bg-white border border-outline-variant rounded-xl transition-all duration-200">
<div class="flex items-center gap-md">
<div class="w-12 h-12 bg-[#1C82FF] rounded-lg flex items-center justify-center font-bold text-white border border-outline-variant/30">
                                W
                            </div>
<span class="font-headline-sm text-headline-sm text-on-surface font-medium">Wave</span>
</div>
<span class="material-symbols-outlined text-primary check-icon hidden" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</div>
</label>
<!-- Orange Money -->
<label class="relative cursor-pointer">
<input class="radio-custom sr-only" name="payment_method" type="radio" value="orange"/>
<div class="flex items-center justify-between p-md bg-white border border-outline-variant rounded-xl transition-all duration-200">
<div class="flex items-center gap-md">
<div class="w-12 h-12 bg-[#FF7900] rounded-lg flex items-center justify-center font-bold text-white border border-outline-variant/30">
                                O
                            </div>
<span class="font-headline-sm text-headline-sm text-on-surface font-medium">Orange Money</span>
</div>
<span class="material-symbols-outlined text-primary check-icon hidden" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</div>
</label>
<!-- MTN MoMo -->
<label class="relative cursor-pointer">
<input class="radio-custom sr-only" name="payment_method" type="radio" value="momo"/>
<div class="flex items-center justify-between p-md bg-white border border-outline-variant rounded-xl transition-all duration-200">
<div class="flex items-center gap-md">
<div class="w-12 h-12 bg-[#FFCC00] rounded-lg flex items-center justify-center font-bold text-black border border-outline-variant/30">
                                M
                            </div>
<span class="font-headline-sm text-headline-sm text-on-surface font-medium">MTN MoMo</span>
</div>
<span class="material-symbols-outlined text-primary check-icon hidden" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</div>
</label>
</div>
</section>

<div class="fixed bottom-0 left-0 right-0 p-md bg-surface border-t border-outline-variant shadow-[0_-4px_6px_-1px_rgb(0_0_0_/_0.05)] md:max-w-md md:mx-auto md:static md:shadow-none">
<button class="w-full h-12 min-h-[48px] bg-primary text-on-primary font-headline-sm text-headline-sm font-semibold rounded-xl flex items-center justify-center gap-2 hover:bg-primary-container transition-colors active:scale-95">
<span class="material-symbols-outlined">lock</span>
            Confirmer le paiement
        </button>
<p class="text-center font-label-sm text-label-sm text-on-surface-variant mt-3 flex items-center justify-center gap-1">
<span class="material-symbols-outlined text-[14px]">shield</span>
            Paiement sécurisé et crypté
        </p>
</div>
